name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The desktop app imports the engine's build output, so it has to exist
      # before anything downstream is typechecked.
      - name: Build the engine
        run: npm run build:core

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the app
        run: npm run build --workspace @operator/desktop
